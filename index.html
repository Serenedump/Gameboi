<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deliver the Parcel</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{--sky:#96d5c8;--board:#4a8797;--ink:#1b1b1b;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#1f4a49;--board:#233f4a}}
:root[data-theme="dark"]{--sky:#1f4a49;--board:#233f4a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sky);font-family:'Russo One',Impact,'Arial Black',sans-serif;color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.scr.on{display:flex}
#game{background:var(--board);justify-content:flex-start;gap:0}
h1{margin:0;text-align:center;line-height:.95;-webkit-text-stroke:3px #1b1b1b;paint-order:stroke fill}
.t1{font-size:clamp(54px,19vw,96px);color:#a06c59;text-shadow:0 5px 0 #1b1b1b}
.t2{font-size:clamp(30px,10.5vw,52px);color:#fff;text-shadow:0 4px 0 #1b1b1b;display:block;margin-top:4px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:4px solid #ffd23f;outline-offset:2px}
.poster{display:block;max-width:94vw;max-height:38vh;width:auto;height:auto;border-radius:16px;border:4px solid #1b1b1b;box-shadow:0 6px 0 #1b1b1b}
.t3{font-size:clamp(22px,7.2vw,40px);color:#fff;text-shadow:0 4px 0 #1b1b1b}
.play{width:132px;height:84px;border-radius:18px;background:#4cd964;border:5px solid #fff;box-shadow:0 0 0 3px #1b1b1b,0 6px 0 3px #1b1b1b;display:flex;align-items:center;justify-content:center;padding:0}
.play:active{transform:translateY(3px)}
#sc{position:absolute;left:0;bottom:0;width:100%;height:150px}
.back{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;width:52px;height:52px;border-radius:12px;background:#fff;border:3px solid #1b1b1b;font-size:24px;color:#1b1b1b}
h2{margin:0;color:#fff;font-size:clamp(30px,9vw,46px);font-style:italic;text-shadow:0 4px 0 rgba(0,0,0,.25)}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:min(88vw,380px)}
.lv{aspect-ratio:1;border:0;border-radius:12px;color:#fff;font-size:28px;position:relative;background:linear-gradient(180deg,#d4896a 0 26%,#8a5a4c 26%);box-shadow:0 4px 0 #5e3b30}
.lv::before{content:'';position:absolute;left:calc(50% - 2px);top:0;width:4px;height:26%;background:#a8654d}
.lv span{position:relative}
.lv:disabled{background:#1b1b1b;box-shadow:0 4px 0 #000;cursor:default;font-size:24px}
.lv:disabled::before{display:none}
.hud{display:flex;align-items:center;gap:10px;width:100%;padding:14px}
.circ{width:64px;height:64px;border-radius:50%;border:5px solid #f0525a;background:#fff;color:#222;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;line-height:1.05}
.circ b{font-size:22px;font-weight:400}
.pz{width:52px;height:52px;border-radius:12px;background:#fff;border:3px solid #1b1b1b;font-size:18px;color:#1b1b1b}
.bw{flex:1;width:100%;display:flex;align-items:center;justify-content:center}
#cv{border-radius:10px;touch-action:none;box-shadow:0 6px 0 rgba(0,0,0,.3)}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;padding:20px}
.ord{width:min(92vw,360px);background:var(--card);border-radius:18px;overflow:hidden;color:#222;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.oh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;gap:8px}
.oh b{font-size:19px;font-weight:400;display:block;line-height:1.1}
.oh small{font-size:11px;color:#777}
.oh i{font-style:normal;background:#4a4d52;color:#fff;border-radius:10px;padding:8px 10px;white-space:nowrap}
.ob{background:#72d155;display:flex;align-items:center;justify-content:space-around;padding:18px 8px;border:2px dashed rgba(255,255,255,.75);margin:0 8px 8px;border-radius:14px}
.st{display:flex;flex-direction:column;align-items:center;gap:6px;width:36%;text-align:center;font-size:12px;color:#12324a}
.st u{text-decoration:none;font-size:34px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:16px;border:3px solid #e8a04a}
.ob em{font-style:normal;font-size:26px;color:#12324a}
.big{font-size:22px;padding:14px 40px;border-radius:16px;border:4px solid #1b1b1b;background:#4cd964;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);min-width:200px}
.big.alt{background:#fff;color:#222;text-shadow:none}

#cash{background:#c9d8e0;justify-content:flex-start;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 14px;overflow:auto}
#cash .back{position:static;align-self:flex-start;flex:none}
.cpts{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);right:16px;font-size:30px;color:#4a5d73}
.cstage{display:flex;align-items:flex-end;justify-content:center;gap:14px;width:min(94vw,420px);height:150px;background:#4f5b6d;border-radius:14px 14px 0 0;padding:0 10px;border-bottom:14px solid #67b06a}
.cwho{font-size:72px;line-height:1;margin-bottom:-6px}
.citem{position:relative;font-size:58px;line-height:1;margin-bottom:8px}
.ctag{position:absolute;left:100%;top:18px;margin-left:-10px;background:#fff;color:#1b1b1b;font-size:22px;padding:6px 10px;border-radius:4px 8px 8px 4px;white-space:nowrap}
.cbag{font-size:52px;margin-bottom:8px}
.reg{background:#79bccb;border-radius:16px;padding:10px;width:min(94vw,320px)}
.disp{background:#ccc;border:5px solid #777;border-radius:10px;padding:6px 12px;display:flex;justify-content:space-between;align-items:center;font-size:34px;margin-bottom:10px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#4a7aa0;padding:10px;border-radius:10px}
.keys button{height:48px;border:0;border-radius:8px;font-size:22px;background:#fff;color:#1b1b1b;box-shadow:0 4px 0 #b9b9b9;padding:0}
.keys button:active{transform:translateY(3px)}
.keys .o{background:#f0d84a;box-shadow:0 4px 0 #b9a526}
.keys .r{background:#e0565e;color:#fff;font-size:15px;box-shadow:0 4px 0 #a73a41}
.hint{width:min(94vw,420px);background:#f6f1e7;border:3px dashed #5aa6d0;color:#3f86b0;font-size:19px;padding:10px 12px;text-align:center;line-height:1.15}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cbtn{font-size:18px;padding:10px 26px;border-radius:14px;border:4px solid #1b1b1b;background:#f0d84a;color:#1b1b1b}

#mart{background:#e4eaee;justify-content:flex-start;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 12px;overflow:auto}
.mtop{display:flex;align-items:center;gap:10px;width:min(94vw,420px)}
.mhud{display:flex;align-items:center;gap:8px;background:#1f2a36;color:#fff;border-radius:12px;padding:6px 12px 6px 6px;flex:1}
.mbk{width:44px;height:44px;border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;line-height:1;color:#1b1b1b}
.mbk small{font-size:9px;color:#2d7de0}
.mhud b{display:block;font-weight:400;font-size:18px;line-height:1.1}
.mbar{height:6px;border-radius:3px;background:#455;margin-top:4px;overflow:hidden}.mbar i{display:block;height:100%;background:#3b9bff;width:0;transition:width .2s}
#mart .back{position:static;flex:none;width:46px;height:46px}
.mban{width:min(94vw,420px);background:#1f78c8;color:#fff;font-style:italic;font-size:28px;padding:8px 14px;border-radius:6px;text-shadow:0 3px 0 rgba(0,0,0,.25);border-bottom:5px solid #14518a}
.mtabs{display:flex;gap:6px;width:min(94vw,420px)}
.mtabs button{flex:1;border:3px solid #1b1b1b;border-radius:10px;background:#fff;color:#1b1b1b;font-size:13px;padding:8px 2px}
.mtabs button.on{background:#ffd83a}
#shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 6px;width:min(94vw,420px);background:#c7d0d6;border-radius:8px;padding:10px 8px;box-shadow:inset 0 -6px 0 #aab4bb}
.pk{border:0;background:#f6f8f9;border-radius:8px;padding:6px 0 0;display:flex;flex-direction:column;align-items:center;font-size:10px;color:#333;box-shadow:0 4px 0 #9aa5ad}
.pk:active{transform:translateY(3px)}
.pk span{font-size:36px;line-height:1.1}
.pk i{font-style:normal;background:#ffd83a;color:#1b1b1b;width:100%;padding:3px 0;margin-top:4px;font-size:13px;border-radius:0 0 8px 8px}
.cartbox{width:min(94vw,420px);background:#c89d66;border:4px solid #8c6a3d;border-radius:4px 4px 16px 16px;min-height:74px;padding:6px 8px;display:flex;flex-wrap:wrap;gap:2px;align-items:center;font-size:30px}
.cartbox em{font-style:normal;font-size:14px;color:#5a3f1e;margin:auto}
.mgo{width:min(94vw,420px);display:flex;gap:8px;align-items:center}
.mgo .big{flex:1;min-width:0;font-size:18px;padding:12px}
.mgo span{font-size:18px;color:#3b4a5a}
.mlist{width:min(94vw,420px);background:#f6f1e7;border:3px dashed #5aa6d0;color:#3f86b0;font-size:15px;padding:8px 10px;line-height:1.5}
.mlist s{opacity:.45}
.cx{border:0;background:none;font-size:30px;padding:0;line-height:1}
.av{font-size:28px;border:3px solid #ddd;background:#fff;border-radius:12px;width:48px;height:48px;padding:0}
.av.on{border-color:#1b1b1b;background:#ffd83a}
.pi{font:inherit;font-size:16px;padding:10px;border:3px solid #1b1b1b;border-radius:10px;width:100%;user-select:text;-webkit-user-select:text;color:#222}
#ride{background:#000;padding:0;gap:0}
#rcv{position:absolute;inset:0;width:100%;height:100%}
#ride>*:not(canvas){position:absolute}
.rmoney{top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;background:#2e8b3d;border:3px solid #1b5e24;border-radius:10px;color:#fff;font-size:24px;padding:4px 12px}
.rmis{top:calc(env(safe-area-inset-top,0px) + 66px);left:12px;width:min(60vw,240px)}
.rmis b{display:block;background:#c0272d;color:#fff;font-size:16px;padding:4px 14px;border-radius:8px;width:max-content;font-weight:400;margin-bottom:6px}
.rmis div{color:#5dff6a;font-size:13px;text-shadow:0 1px 2px #000;line-height:1.35}
.rmm{top:calc(env(safe-area-inset-top,0px) + 14px);right:76px;width:60px;height:60px;border-radius:50%;border:4px solid #fff;background:#1b2a44;overflow:hidden}
.rmm::before{content:'';position:absolute;left:calc(50% - 3px);top:0;width:6px;height:100%;background:#ffd83a;opacity:.6}
.rmm i{position:absolute;left:calc(50% - 6px);bottom:8%;width:12px;height:12px;border-radius:50%;background:#ff4040}
.rb{bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:rgba(0,0,0,.55);color:#fff;font-size:30px;padding:0;touch-action:none}

<script>
const $=s=>document.querySelector(s),cv=$('#cv'),g=cv.getContext('2d'),sc=$('#sc'),sg=sc.getContext('2d');
const DX={1:0,2:1,4:0,8:-1},DY={1:-1,2:0,4:1,8:0},OPP={1:4,2:8,4:1,8:2},DIRS=[1,2,4,8];
const SIZES=[[3,3],[3,3],[3,3],[4,3],[4,3],[4,3],[4,3],[4,4],[4,4],[4,4],[4,4],[4,4]];
const ORD=[
["Lola's Birthday Merienda","🥖","Aling Rosa's Bakery","🏠","Lola's Home"],
["Fiesta Lechon Rush","🐖","Mang Tomas' Lechon","🎪","Fiesta Plaza"],
["Halo-halo Break","🍧","Ate Gina's Halo-halo","🏛️","Barangay Hall"],
["Noche Buena Ham","🍖","Palengke","🎄","Cruz Family Home"],
["Class Project Drop","📚","Bookstore","🏫","Rizal High School"],
["Medicine for Lolo","💊","Botika","🏡","Lolo Ben's House"],
["Wedding Cake","🎂","Sweet Tooth Bakery","⛪","San Jose Church"],
["Flowers for Nanay","💐","Flower Stall","🏠","Nanay's House"],
["Pasalubong Box","📦","Airport Cargo","🏠","Tita Lyn's Home"],
["Sinigang Takeout","🍲","Aling Nena's Carinderia","🏢","Office Tower"],
["Graduation Gift","🎁","Mall Gift Shop","🎓","University Gym"],
["Last Order of the Day","🍕","Pizza Corner","🏠","Home Sweet Home"]];
let rnd,B=null,cur=0,mode='menu',scr='title',prog=0,best={},dpr=1,bx=0;
try{const s=JSON.parse(localStorage.getItem('dtp')||'{}');prog=s.p||0;best=s.b||{}}catch(e){}
function save(){try{localStorage.setItem('dtp',JSON.stringify({p:prog,b:best}))}catch(e){}}
function mul(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=(rnd()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){scr=id;document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id===id))}
function pop(h){const p=$('#pop');p.innerHTML=h;p.style.display='flex'}
function hidePop(){$('#pop').style.display='none'}

/* ---------- level generation ---------- */
function find(cols,rows,minLen){
  const s=[0,(rnd()*rows)|0],h=[cols-1,(rnd()*rows)|0],seen=new Set(),path=[],maxLen=cols*rows-2;let calls=0;
  const w=(c,r)=>{
    if(++calls>20000)return false;
    path.push([c,r]);seen.add(c+','+r);
    if(c==h[0]&&r==h[1]){if(path.length>=minLen)return true}
    else if(path.length<maxLen){
      for(const d of shuf(DIRS.slice())){
        const nc=c+DX[d],nr=r+DY[d];
        if(nc<0||nr<0||nc>=cols||nr>=rows||seen.has(nc+','+nr))continue;
        if(w(nc,nr))return true}}
    path.pop();seen.delete(c+','+r);return false};
  return w(s[0],s[1])?path.slice():null}
const dirTo=(a,b)=>DIRS.find(d=>DX[d]==b[0]-a[0]&&DY[d]==b[1]-a[1]);
function swap(i){const t=B.cells[i],e=B.empty;t.cx=e%B.cols;t.cy=(e/B.cols)|0;B.cells[e]=t;B.cells[i]=null;B.empty=i}
function build(lv){
  rnd=mul(lv*7919+13);
  const [cols,rows]=SIZES[lv];
  let path=null;
  for(let m=cols;m>=2&&!path;m--)path=find(cols,rows,m);
  const n=cols*rows,cells=new Array(n).fill(null),onP=new Set(path.map(([c,r])=>r*cols+c));
  const filler=()=>{const x=rnd(),a=x<.3?[5,10]:x<.8?[3,6,12,9]:[7,11,13,14];return a[(rnd()*a.length)|0]};
  path.forEach(([c,r],i)=>{
    const pd=i?dirTo(path[i],path[i-1]):0,nd=i<path.length-1?dirTo(path[i],path[i+1]):0;
    cells[r*cols+c]={m:pd|nd,k:i==0?'b':i==path.length-1?'h':''}});
  const free=[];for(let i=0;i<n;i++)if(!onP.has(i))free.push(i);
  const empty=free[(rnd()*free.length)|0];
  for(const i of free)if(i!==empty)cells[i]={m:filler(),k:''};
  cells.forEach((t,i)=>{if(t){t.cx=t.x=i%cols;t.cy=t.y=(i/cols)|0}});
  B={cols,rows,cells,empty,moves:0,drive:null,cs:60,pending:false,tiles:cells.filter(Boolean)};
  let prev=-1;
  for(let s=0;s<4+lv*2||conn();s++){
    const e=B.empty,ec=e%cols,er=(e/cols)|0,nb=[];
    for(const d of DIRS){const c=ec+DX[d],r=er+DY[d];if(c<0||r<0||c>=cols||r>=rows)continue;const j=r*cols+c;if(j!==prev)nb.push(j)}
    const j=nb[(rnd()*nb.length)|0];swap(j);prev=e}
  B.tiles.forEach(t=>{t.x=t.cx;t.y=t.cy})}

/* ---------- connection + driving ---------- */
function conn(){
  const {cols,rows,cells}=B,s=cells.findIndex(t=>t&&t.k==='b'),par={[s]:-1},q=[s];
  while(q.length){
    const i=q.shift(),t=cells[i];
    if(t.k==='h'){const p=[];for(let j=i;j!==-1;j=par[j])p.unshift(j);return p}
    const c=i%cols,r=(i/cols)|0;
    for(const d of DIRS){
      if(!(t.m&d))continue;
      const nc=c+DX[d],nr=r+DY[d];
      if(nc<0||nr<0||nc>=cols||nr>=rows)continue;
      const j=nr*cols+nc,u=cells[j];
      if(!u||!(u.m&OPP[d])||j in par)continue;
      par[j]=i;q.push(j)}}

function startDrive(path){
  const pts=[],cols=B.cols,pos=i=>[i%cols,(i/cols)|0];
  for(let i=0;i<path.length;i++){
    const [c,r]=pos(path[i]),cx=c+.5,cy=r+.5;
    const pd=i?dirTo(pos(path[i]),pos(path[i-1])):0,nd=i<path.length-1?dirTo(pos(path[i]),pos(path[i+1])):0;
    const A=pd?[cx+DX[pd]/2,cy+DY[pd]/2]:[cx,cy],Z=nd?[cx+DX[nd]/2,cy+DY[nd]/2]:[cx,cy];
    const C=(pd&&nd)?[cx,cy]:[(A[0]+Z[0])/2,(A[1]+Z[1])/2];
    for(let k=i?1:0;k<=10;k++){const t=k/10,u=1-t;pts.push([u*u*A[0]+2*u*t*C[0]+t*t*Z[0],u*u*A[1]+2*u*t*C[1]+t*t*Z[1]])}}

function drivePos(){
  const d=B.drive,L=d.L;let i=1;
  while(i<L.length-1&&L[i]<d.d)i++;
  const a=L[i-1],b=L[i],t=b>a?(d.d-a)/(b-a):0,p=d.pts[i-1],q=d.pts[i];
  return{x:p[0]+(q[0]-p[0])*t,y:p[1]+(q[1]-p[1])*t,a:d.ang[i]}}

/* ---------- drawing ---------- */
function bike(c,x,y,a,s){
  c.save();c.translate(x,y);c.rotate(a);
  const R=(px,py,w,h,col,r)=>{c.fillStyle=col;c.beginPath();c.roundRect((px-w/2)*s,(py-h/2)*s,w*s,h*s,(r||.03)*s);c.fill()};
  R(-.26,0,.2,.07,'#222',.03);R(.27,0,.2,.07,'#222',.03);
  R(.02,0,.56,.13,'#2a2a2e',.06);
  R(.23,0,.2,.15,'#ffc21a',.05);
  R(.34,0,.04,.1,'#e8f6ff',.02);
  R(.15,0,.04,.34,'#222',.02);
  R(-.22,0,.38,.4,'#b78600',.05);R(-.22,0,.34,.36,'#ffcc00',.04);
  R(.1,-.15,.16,.05,'#e6ab00',.02);R(.1,.15,.16,.05,'#e6ab00',.02);
  R(.0,0,.2,.3,'#ffc61a',.1);R(.04,0,.045,.3,'#1a56db',.02);
  c.fillStyle='#ffe066';c.beginPath();c.arc(.1*s,0,.09*s,0,7);c.fill();
  R(.1,0,.17,.04,'#c8402a',.02);R(.17,0,.04,.11,'#1c1c1f',.02);
  c.restore();
  const tx=x-Math.cos(a)*.22*s,ty=y-Math.sin(a)*.22*s;
  c.fillStyle='#222';c.textAlign='center';c.textBaseline='middle';
  c.font='bold '+(.105*s)+"px Impact,'Arial Black',sans-serif";c.fillText("PED'S",tx,ty-.05*s);
  c.font='bold '+(.06*s)+"px Impact,'Arial Black',sans-serif";c.fillText('EXTRA',tx,ty+.06*s);
  c.fillText('DELIVERY',tx,ty+.12*s);
  c.textAlign='start';c.textBaseline='alphabetic'}
function roadP(m,h){
  const p=new Path2D(),d=DIRS.filter(x=>m&x),e=x=>[h+DX[x]*h,h+DY[x]*h];
  if(d.length==2){const a=e(d[0]),b=e(d[1]);p.moveTo(...a);if(m==5||m==10)p.lineTo(...b);else p.quadraticCurveTo(h,h,...b)}
  else for(const x of d){p.moveTo(h,h);p.lineTo(...e(x))}
  return p}
function houseD(h,cs){
  const w=cs*.44,x=h-w/2,y=h-w*.5;
  g.fillStyle='#f0525a';g.fillRect(x,y,w,w*.9);
  g.fillStyle='#c93a45';g.beginPath();g.moveTo(x-cs*.03,y);g.lineTo(x+w/2,y-w*.35);g.lineTo(x+w+cs*.03,y);g.fill();
  g.fillStyle='#fff';g.fillRect(x+w*.12,y+w*.45,w*.24,w*.24);g.fillStyle='#222';g.fillRect(x+w*.18,y+w*.51,w*.12,w*.12)}
function tile(t,cs){
  const h=cs/2;g.save();g.translate(t.x*cs,t.y*cs);
  g.fillStyle='#78d65a';g.beginPath();g.roundRect(2,2,cs-4,cs-4,cs*.1);g.fill();
  g.beginPath();g.rect(0,0,cs,cs);g.clip();
  const p=roadP(t.m,h);g.lineJoin='round';g.lineCap='butt';
  g.strokeStyle='#efe4cf';g.lineWidth=cs*.54;g.stroke(p);
  g.strokeStyle='#858085';g.lineWidth=cs*.4;g.stroke(p);
  g.strokeStyle='#fff';g.lineWidth=Math.max(1,cs*.025);g.setLineDash([cs*.07,cs*.06]);g.stroke(p);g.setLineDash([]);
  if(t.k=='h')houseD(h,cs);
  if(t.k=='b'&&!B.drive)bike(g,h,h,Math.atan2(DY[t.m],DX[t.m]),cs*1.2);
  g.restore()}
function draw(){
  const cs=B.cs;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,cv.width,cv.height);
  g.fillStyle='#5fb847';g.beginPath();g.roundRect(0,0,B.cols*cs,B.rows*cs,10);g.fill();
  for(const t of B.tiles)tile(t,cs);
  if(B.drive){const p=drivePos();bike(g,p.x*cs,p.y*cs,p.a,cs*1.2)}}
function update(dt){

function cDraw(bad){
  const it=C.items[Math.min(C.i,C.items.length-1)];
  if(C.ph=='change'){$('#cem').textContent='💵';$('#ctag').textContent=peso(C.paid)}

function cKey(k){
  if(C.lock)return;
  if(/^\d$|^\.$/.test(k)){
    if(k=='.'&&C.e.includes('.'))return;
    if(/\.\d\d$/.test(C.e)||C.e.length>=8)return;
    C.e=(k=='.'&&C.e==='')?'0.':C.e+k;return cDraw()}
  if(k=='CLEAR'){C.e='';if(C.ph=='add')C.tot=C.items.slice(0,C.i).reduce((s,x)=>s+x[2],0);return cDraw()}
  if(k=='+'){
    if(C.ph!='add')return cMsg(C.ph=='total'?'Press TOTAL now.':'Enter the change and press PAY.');
    const it=C.items[C.i];
    if(cents(parseFloat(C.e||0))!=cents(it[2]))return cBad('Check the price tag!');
    C.tot+=it[2];C.pts+=10;C.i++;C.e='';
    if(C.i>=C.items.length)C.ph='total';
    return cDraw()}
  if(k=='-'){
    if(C.ph=='change'&&C.e!==''){C.e=(parseFloat(C.e)-C.tot).toFixed(2);if(parseFloat(C.e)<0)return cBad('Paid is less than the total.');return cDraw()}
    return cMsg(C.ph=='change'?'Type the cash paid, then press − to get the change.':'Use + to add each price.')}

    const b=[20,50,100,200,500,1000].find(x=>x>=C.tot)||1000;
    C.paid=b;C.ph='change';C.e='';C.tot=Math.round(C.tot*100)/100;return cDraw()}
  if(k=='PAY'){
    if(C.ph!='change')return cMsg('Finish adding and press TOTAL first.');
    if(cents(parseFloat(C.e||-1))!=cents(C.paid-C.tot))return cBad('Not quite. Change = paid − total.');

  DB.ref('open').once('value').then(sn=>{
    const o=sn.val()||{},ks=Object.keys(o).filter(k=>Date.now()-o[k].t<1800000).slice(0,8);
    pop(`<div class="ord" style="padding:14px;color:#222;display:flex;flex-direction:column;gap:8px"><b style="font-weight:400;font-size:19px">Open orders</b>${ks.length?ks.map(k=>`<button class="big alt" data-j="${k}" style="font-size:15px;padding:10px;min-width:0;width:100%">${esc(o[k].av)} ${esc(o[k].name)} · ${esc(o[k].items)}</button>`).join(''):'<span style="font-family:sans-serif;font-size:14px">No orders yet. Ask a friend to place one!</span>'}</div><button class="big alt" data-a="mpr">Refresh</button><button class="big alt" data-a="mpx">Close</button>`)})}
function mpAccept(code){
  DB.ref('rooms/'+code).once('value').then(sn=>{
    const r=sn.val();if(!r||r.status!='waiting')return mpRider();
    DB.ref('rooms/'+code).update({status:'accepted',rider:P.name.trim()||'Rider'});DB.ref('open/'+code).remove();
    MP={code,role:'rider'};const a=ALL();
    M.order=r.items.map(n=>a.find(x=>x[1]==n)).filter(Boolean);M.buyer={name:r.buyer.name,av:r.buyer.av,addr:r.buyer.addr,ic:'🏠'};
    M.cart=[];M.flow=true;hidePop();mOpen()})}
function mpChatUI(role){
  const b=M.buyer;
  pop(`<div class="ord"><div class="oh" style="background:#f0f0f0"><div><b>${role=='buyer'?'🛵 Your rider':esc(b.av+' '+b.name)}</b><small>Order chat · type below</small></div><i>📦</i></div><div id="chat" style="padding:10px;display:flex;flex-direction:column;gap:8px;min-height:110px;max-height:34vh;overflow-y:auto;font-family:sans-serif;font-size:14px;color:#222"></div></div>
  <div style="display:flex;gap:6px;width:min(92vw,360px)"><input class="pi" id="ct" maxlength="120" placeholder="Type a message..." autocomplete="off" style="flex:1"><button class="big" id="cs" style="min-width:0;padding:10px 16px;font-size:16px">➤</button></div>
  ${role=='buyer'?'<div style="display:flex;gap:6px;width:min(92vw,360px)">'+[1,2,3,4,5].map(n=>`<button class="big alt" data-star="${n}" style="min-width:0;flex:1;padding:8px 0;font-size:15px">${n}⭐</button>`).join('')+'</div><div style="font-size:12px;color:#fff;font-family:sans-serif">Got your order? Tap a rating to finish.</div>':'<div style="font-size:12px;color:#fff;font-family:sans-serif">Tell the buyer you arrived. Waiting for them to confirm...</div>'}`);
  CH=DB.ref('rooms/'+MP.code+'/chat');
  CH.on('child_added',sn=>{const m=sn.val();bub(m.f==role?'me':'buyer',m.t)});
  if(role=='rider')DB.ref('rooms/'+MP.code).on('value',sn=>{
    const r=sn.val();if(r&&r.status=='done'&&!R.mpDone){R.mpDone=1;R.stars=r.rating||5;DB.ref('rooms/'+MP.code).off();CH.off();rFin()}})}
function mpSend(){
  const ct=$('#ct'),v=ct.value.trim();if(!v)return;ct.value='';
  DB.ref('rooms/'+MP.code+'/chat').push({f:MP.role,t:v.slice(0,120)})}
$('#pop').addEventListener('click',e=>{
  const pk=e.target.closest('[data-pk]'),j=e.target.closest('[data-j]'),st=e.target.closest('[data-star]');
  if(pk){const i=+pk.dataset.pk,k=PK.indexOf(i);if(k>-1)PK.splice(k,1);else if(PK.length<4)PK.push(i);pk.classList.toggle('on',PK.includes(i))}
  if(j)mpAccept(j.dataset.j);
  if(st){const n=+st.dataset.star;DB.ref('rooms/'+MP.code).update({rating:n,status:'done'});
    mpBox('Order complete! '+'⭐'.repeat(n),'Thanks for ordering.','<button class="big" data-a="home">Home</button>')}});
addEventListener('resize',resize);resize();
let last=performance.now();
(function loop(n){
  const dt=Math.min(.05,(n-last)/1000);last=n;
  if(scr=='title')titleScene(dt);
  else if(scr=='game'&&B){update(dt);draw()}
  else if(scr=='ride')ride_(dt)
  requestAnimationFrame(loop)})(last);
</script></body></html>
